[project]
name = "nem-time-series"
version = "0.1.0"
description = "Benchmark time-series foundation models on NEM electricity prices (public data only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas[pyarrow]>=2.2",
    "nemosis>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "lightgbm>=4.3",
    "holidays>=0.50",
    "typer>=0.12",
]

[project.optional-dependencies]
# Foundation models. Kept separate so the data steps do not need torch.
# On ARM64 Linux PyPI's torch wheel is CPU-only; on Colab the preinstalled CUDA torch is reused.
models = [
    "torch>=2.3",
    "chronos-forecasting>=2.0",
    "peft>=0.10",
]
# Excel report (make report).
report = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8",
]

[project.scripts]
nem-ts = "nem_ts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nem_ts"]

# Local installs with uv (make setup) use CPU-only torch: no CUDA libs, a much smaller venv.
# Colab installs with pip, which ignores [tool.uv], so it keeps its own preinstalled CUDA torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
